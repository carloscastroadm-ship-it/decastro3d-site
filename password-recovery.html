
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha | DECASTRO3D</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(90%, 380px);
      padding: 28px;
      background: #1d1d1d;
      border: 1px solid #b89550;
      border-radius: 12px;
      box-sizing: border-box;
    }
    h1 { color: #d4b16a; font-size: 24px; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 6px;
      font-size: 16px;
    }
    input { border: 1px solid #777; }
    button {
      border: 0;
      background: #c5a15b;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }
    #status { color: #e5c77f; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Redefinir senha</h1>
    <p>Digite sua nova senha para acessar o painel DECASTRO3D.</p>
    <form id="resetForm">
      <input id="password" type="password" placeholder="Nova senha" minlength="8" required>
      <input id="confirm" type="password" placeholder="Confirme a nova senha" minlength="8" required>
      <button type="submit">Salvar nova senha</button>
    </form>
    <p id="status">Validando link de recuperação...</p>
  </main>

  <script>
    const status = document.getElementById("status");
    const form = document.getElementById("resetForm");
    form.style.display = "none";

    if (window.netlifyIdentity) {
      netlifyIdentity.on("init", async () => {
        try {
          await netlifyIdentity.handleAuthCallback();
          const user = netlifyIdentity.currentUser();
          if (user) {
            status.textContent = "Link validado. Crie sua nova senha.";
            form.style.display = "block";
          } else {
            status.textContent = "Abra novamente o link recebido por e-mail.";
          }
        } catch (error) {
          status.textContent = "Não foi possível validar o link. Solicite uma nova recuperação.";
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (password !== confirm) {
          status.textContent = "As senhas não são iguais.";
          return;
        }

        try {
          const user = netlifyIdentity.currentUser();
          if (!user) throw new Error("Sessão de recuperação não encontrada.");
          await user.update({ password });
          status.textContent = "Senha atualizada! Acesse o painel.";
          form.style.display = "none";
          setTimeout(() => {
            window.location.href = "/admin/";
          }, 2000);
        } catch (error) {
          status.textContent = "Erro ao salvar. Verifique o link e tente novamente.";
        }
      });
    } else {
      status.textContent = "Erro ao carregar o serviço de autenticação.";
    }
  </script>
</body>
</html>
