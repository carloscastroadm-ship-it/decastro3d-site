
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Recuperar senha | DECASTRO3D</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      border: 1px solid #9d7b37;
      border-radius: 12px;
      background: #191919;
    }
    h1 {
      color: #d6b568;
      text-align: center;
      font-size: 25px;
    }
    p { color: #ccc; line-height: 1.5; text-align: center; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 6px;
      background: #c5a45b;
      color: #111;
      font-weight: bold;
      font-size: 16px;
    }
    #form { display: none; }
    #status { margin-top: 20px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>DECASTRO3D</h1>
    <p>Crie uma nova senha para acessar seu painel.</p>

    <form id="form">
      <label for="password">Nova senha</label>
      <input id="password" type="password"
        minlength="8" autocomplete="new-password" required>

      <label for="confirm">Confirme a nova senha</label>
      <input id="confirm" type="password"
        minlength="8" autocomplete="new-password" required>

      <button type="submit">Salvar nova senha</button>
    </form>

    <p id="status">Validando link de recuperação...</p>
  </main>

  <script type="module">
    import {
      handleAuthCallback,
      updateUser
    } from "https://esm.sh/@netlify/identity@2.0.1";

    const form = document.getElementById("form");
    const status = document.getElementById("status");

    try {
      const result = await handleAuthCallback();

      if (result && result.type === "recovery") {
        status.textContent = "Link validado. Digite sua nova senha.";
        form.style.display = "block";
      } else {
        status.textContent =
          "Link de recuperação não encontrado. Solicite um novo e-mail.";
      }
    } catch (error) {
      console.error(error);
      status.textContent =
        "Não foi possível validar o link. Solicite uma nova recuperação.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        status.textContent = "As senhas não são iguais.";
        return;
      }

      try {
        await updateUser({ password });

        status.textContent =
          "Senha atualizada com sucesso! Redirecionando...";

        form.style.display = "none";

        setTimeout(() => {
          window.location.href = "/admin/";
        }, 2000);

      } catch (error) {
        console.error(error);
        status.textContent =
          "Erro ao salvar a senha. Tente solicitar um novo link.";
      }
    });
  </script>
</body>
</html>
